<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a8f">
<title>OCTO7</title>
<style>
:root{--bg:#f2f4fa;--card:#fff;--ink:#141a3a;--mut:#5b6280;--line:#dfe3f0;--brand:#2b3a8f;--on:#fff;--bad:#b3261e;--l:#2b3a8f;--r:#c98a00;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1124;--card:#171b38;--ink:#eceefb;--mut:#9aa1c4;--line:#262b52;--brand:#8c9bff;--on:#0e1124;--bad:#ff8a80;--l:#8c9bff;--r:#f0b429;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 0}
header{display:flex;justify-content:space-between;align-items:baseline;max-width:560px;margin:0 auto;padding:14px 16px 4px}
header span{color:var(--mut);font-size:.9rem;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:.02em}
h2{font-size:1.05rem;margin:0 0 10px}
p{margin:0 0 8px}
.mut,.note{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.hero{background:var(--brand);color:var(--on);border-radius:22px;padding:18px;margin:0 0 12px}
.bal{font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{display:flex;gap:3px;height:20px;margin:6px 0}
.bar i{background:var(--l);border-radius:10px 4px 4px 10px;min-width:6px}
.bar i.r{background:var(--r);border-radius:4px 10px 10px 4px}
.lr{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600}
label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mut)}
input,select{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:inherit;font-weight:700}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--brand);font:inherit;padding:10px 0;text-decoration:underline}
.auth{padding-top:8vh}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{color:#1b7f3b;font-weight:600}.neg{color:var(--bad);font-weight:600}
@media(prefers-color-scheme:dark){.pos{color:#7ddc9a}}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.qty span{min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:.8rem;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.tag.L{border-color:var(--l)}.tag.R{border-color:var(--r)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mut);font:inherit;font-size:.9rem}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:528px;margin:auto;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--bad);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://xqckhmrzdzhsdronrbow.supabase.co", "sb_publishable_kvOcNoJlS_YTk0vf8N4HBg_WWrWLsGp");
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 2});
const day = d => new Date(d).toLocaleDateString("en-IN", {day: "numeric", month: "short"});
let me = null, cfg = {}, tab = "home", cart = {};

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 3800);
}
async function call(p) {
  const {data, error} = await p;
  if (error) { toast(error.message, true); throw error; }
  return data;
}
async function act(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) {} finally { btn.disabled = false; }
}

/* ---------- sign in / register ---------- */
function authView(mode = "login") {
  const reg = mode === "reg";
  app.innerHTML = `<main class="auth"><h1>OCTO7</h1>
  <p class="mut">Garments, your team and your earnings in one place.</p>
  <form id="f" class="card">
    ${reg ? `<label>Full name<input name="name" required autocomplete="name"></label>
    <label>Mobile number<input name="mobile" inputmode="tel" required autocomplete="tel"></label>` : ""}
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="pw" type="password" minlength="6" required autocomplete="${reg ? "new-password" : "current-password"}"></label>
    <button class="btn">${reg ? "Create account" : "Log in"}</button>
  </form>
  <button class="link" id="sw">${reg ? "I already have an account" : "New member? Register"}</button></main>`;
  $("#sw").onclick = () => authView(reg ? "login" : "reg");
  $("#f").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), btn = $(".btn");
    act(btn, async () => {
      const email = f.get("email").trim(), password = f.get("pw");
      if (reg) {
        const {data, error} = await sb.auth.signUp({email, password, options: {data: {full_name: f.get("name").trim(), mobile: f.get("mobile").trim()}}});
        if (error) { toast(error.message, true); return; }
        if (data.session) await loadMe();
        else { toast("Account created. Confirm the email we sent, then log in."); authView("login"); }
      } else {
        const {error} = await sb.auth.signInWithPassword({email, password});
        if (error) { toast(error.message, true); return; }
        await loadMe();
      }
    });
  };
}

/* ---------- after sign in ---------- */
async function loadMe() {
  const {data: {user}} = await sb.auth.getUser();
  if (!user) return authView();
  const {data} = await sb.from("members").select("*").eq("id", user.id).maybeSingle();
  if (!data) { toast("Your profile is not ready yet. Try again in a moment.", true); return authView(); }
  me = data;
  const s = await sb.from("app_settings").select("key,value");
  cfg = Object.fromEntries((s.data || []).map(r => [r.key, r.value]));
  if (me.status === "blocked") return gate("Account blocked", "Please contact the company help line.");
  if (!me.parent_id && me.status !== "active") return placeView();
  if (me.status === "pending") return activateView();
  shell();
}
function gate(title, text) {
  app.innerHTML = `<main class="auth"><h1>${esc(title)}</h1><p class="mut">${esc(text)}</p><button class="link" id="lo">Log out</button></main>`;
  $("#lo").onclick = logout;
}
async function logout() { await sb.auth.signOut(); me = null; authView(); }

function placeView() {
  app.innerHTML = `<main class="auth"><h1>Join the team</h1>
  <p class="mut">Enter the member ID of the person who invited you, and choose where you sit under them.</p>
  <form id="f" class="card">
    <label>Sponsor ID<input name="sp" required placeholder="O71000001" autocapitalize="characters"></label>
    <label>Place under member ID <span class="note">(leave empty to sit directly under your sponsor)</span><input name="pa" autocapitalize="characters"></label>
    <label>Side<select name="side"><option value="L">Left</option><option value="R">Right</option></select></label>
    <button class="btn">Confirm my place</button>
  </form><button class="link" id="lo">Log out</button></main>`;
  $("#lo").onclick = logout;
  $("#f").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), sp = f.get("sp").trim().toUpperCase(), pa = f.get("pa").trim().toUpperCase() || sp;
    act($(".btn"), async () => {
      await call(sb.rpc("register_placement", {p_parent_code: pa, p_side: f.get("side"), p_sponsor_code: sp}));
      await loadMe();
    });
  };
}
function activateView() {
  app.innerHTML = `<main class="auth"><h1>Activate your ID</h1>
  <p class="mut">Enter the secret pin you received from the company or your team leader.</p>
  <form id="f" class="card"><label>Activation pin<input name="pin" required autocapitalize="characters" autocomplete="off"></label>
  <button class="btn">Activate</button></form><button class="link" id="lo">Log out</button></main>`;
  $("#lo").onclick = logout;
  $("#f").onsubmit = e => {
    e.preventDefault();
    act($(".btn"), async () => {
      await call(sb.rpc("activate_with_pin", {p_pin: new FormData(e.target).get("pin")}));
      toast("Your ID is active."); await loadMe();
    });
  };
}

/* ---------- main app ---------- */
function shell() {
  const tabs = [["home", "Home"], ["shop", "Shop"], ["team", "Team"], ["wallet", "Wallet"], ["me", "Profile"]];
  app.innerHTML = `<header><b>${esc(me.full_name || "Member")}</b><span>${esc(me.member_code)}</span></header>
  <main id="v"></main>
  <nav>${tabs.map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("")}</nav>`;
  app.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; shell(); });
  $("#v").innerHTML = '<p class="mut">Loading…</p>';
  ({home, shop, team, wallet, me: profile})[tab]().catch(() => {});
}

async function home() {
  const [w, b, n, c] = await Promise.all([
    sb.from("wallets").select("balance").eq("member_id", me.id).maybeSingle(),
    sb.from("binary_state").select("*").eq("member_id", me.id).maybeSingle(),
    sb.from("notifications").select("*").order("created_at", {ascending: false}).limit(5),
    sb.from("member_coupons").select("coupon_type,remaining").eq("member_id", me.id)]);
  const L = +(b.data?.left_carry || 0), R = +(b.data?.right_carry || 0);
  const cp = {discount: 0, redeem: 0};
  (c.data || []).forEach(x => cp[x.coupon_type] += +x.remaining);
  $("#v").innerHTML = `<section class="hero"><p>Wallet balance</p><div class="bal">${inr(w.data?.balance)}</div></section>
  <section class="card"><h2>Your two legs</h2>
    <div class="bar"><i style="flex:${L || 0.0001}"></i><i class="r" style="flex:${R || 0.0001}"></i></div>
    <div class="lr"><span>Left ${L} PV</span><span>Right ${R} PV</span></div>
    <p class="note">Volume that is not matched yet stays here until the other leg catches up.</p></section>
  <section class="card"><h2>My coupons</h2>
    <div class="row"><span>Discount coupon balance</span><b>${inr(cp.discount)}</b></div>
    <div class="row"><span>Redeem coupon balance</span><b>${inr(cp.redeem)}</b></div></section>
  <section class="card"><h2>Notifications</h2>${(n.data || []).map(x => `<div class="row"><div><b>${esc(x.title)}</b><br><span class="note">${esc(x.body)}</span></div><span class="note">${day(x.created_at)}</span></div>`).join("") || '<p class="mut">Nothing new. Updates about orders, pins and payouts appear here.</p>'}</section>`;
}

const STATUS = {placed: "Placed", paid: "Paid", shipped: "Shipped", delivered: "Delivered", cancelled: "Cancelled", returned: "Returned"};
async function shop() {
  const [p, o] = await Promise.all([
    sb.from("products").select("*").eq("active", true).order("created_at"),
    sb.from("orders").select("*").order("created_at", {ascending: false}).limit(10)]);
  const items = p.data || [];
  $("#v").innerHTML = `<h2>Garments</h2>${items.map(x => `<div class="card"><div class="row" style="border:0;padding:0">
    <div><b>${esc(x.name)}</b><br><span class="note">${esc(x.description || "")}</span><br><b>${inr(x.price)}</b> <span class="note">${+x.pv} PV</span></div>
    <div class="qty"><button data-id="${x.id}" data-d="-1" aria-label="Less">−</button><span id="q-${x.id}">${cart[x.id] || 0}</span><button data-id="${x.id}" data-d="1" aria-label="More">+</button></div></div></div>`).join("") || '<p class="mut">No garments are listed yet. Please check back soon.</p>'}
  ${items.length ? `<div class="card"><div class="row" style="border:0"><span>Order total</span><b id="tot"></b></div><button class="btn" id="po">Place order</button>
  <p class="note" style="margin-top:8px">The company confirms your order after payment and updates its status here.</p></div>` : ""}
  <h2>My orders</h2><div class="card">${(o.data || []).map(x => `<div class="row"><span>${day(x.created_at)}</span><span class="tag">${STATUS[x.status] || x.status}</span><b>${inr(x.total)}</b></div>`).join("") || '<p class="mut">You have not placed an order yet.</p>'}</div>`;
  const total = () => { const t = $("#tot"); if (t) t.textContent = inr(items.reduce((s, x) => s + (cart[x.id] || 0) * x.price, 0)); };
  total();
  $("#v").querySelectorAll(".qty button").forEach(b => b.onclick = () => {
    const id = b.dataset.id; cart[id] = Math.max(0, Math.min(100, (cart[id] || 0) + +b.dataset.d));
    $("#q-" + id).textContent = cart[id]; total();
  });
  const po = $("#po");
  if (po) po.onclick = () => act(po, async () => {
    const list = Object.entries(cart).filter(([, q]) => q > 0).map(([product_id, qty]) => ({product_id, qty}));
    if (!list.length) { toast("Choose at least one garment.", true); return; }
    await call(sb.rpc("place_order", {p_items: list}));
    cart = {}; toast("Order placed."); await shop();
  });
}

async function team() {
  const rows = await call(sb.rpc("get_my_team", {p_max_depth: 10}));
  const down = rows.filter(r => r.depth > 0);
  $("#v").innerHTML = `<div class="card"><h2>My team</h2><p>${down.length ? `${down.length} member${down.length > 1 ? "s" : ""} under you.` : "No one has joined under you yet."}</p>
  <p class="note">New members enter your member ID <b>${esc(me.member_code)}</b> as their sponsor ID when they register.</p></div>
  <div class="card">${down.map(r => `<div class="row" style="padding-left:${Math.min(r.depth - 1, 7) * 14}px"><span>${esc(r.full_name || "Member")}<br><span class="note">${esc(r.member_code)} under ${esc(r.parent_code || "")}</span></span><span><span class="tag ${r.side}">${r.side === "L" ? "Left" : "Right"}</span> <span class="note">${r.status === "active" ? "Active" : "Pending"}</span></span></div>`).join("") || '<p class="mut">Your team tree will appear here.</p>'}</div>`;
}

const KIND = {binary_commission: "Binary income", sponsor_bonus: "Sponsor bonus", withdrawal: "Withdrawal"};
async function wallet() {
  const [w, t, d] = await Promise.all([
    sb.from("wallets").select("balance").eq("member_id", me.id).maybeSingle(),
    sb.from("wallet_transactions").select("*").eq("member_id", me.id).order("created_at", {ascending: false}).limit(30),
    sb.from("withdrawals").select("*").eq("member_id", me.id).order("created_at", {ascending: false}).limit(10)]);
  const min = +cfg.min_withdrawal || 0, pct = +cfg.withdrawal_admin_charge_pct || 0, tds = +cfg.tds_pct || 0;
  $("#v").innerHTML = `<section class="hero"><p>Available balance</p><div class="bal">${inr(w.data?.balance)}</div></section>
  <form id="wf" class="card"><h2>Withdraw</h2>
    <label>Amount (minimum ${inr(min)})<input name="amt" type="number" inputmode="decimal" min="${min}" step="1" required></label>
    <p class="note" id="pv">Admin charge ${pct}%${tds ? `, TDS ${tds}%` : ""} is deducted from the amount.</p>
    <button class="btn">Request withdrawal</button></form>
  <div class="card"><h2>Withdrawal requests</h2>${(d.data || []).map(x => `<div class="row"><span>${day(x.created_at)}<br><span class="note">You receive ${inr(x.net_amount)}</span></span><span class="tag">${esc(x.status)}</span><b>${inr(x.amount)}</b></div>`).join("") || '<p class="mut">No withdrawal requests yet.</p>'}</div>
  <div class="card"><h2>Transactions</h2>${(t.data || []).map(x => `<div class="row"><span>${esc(KIND[x.kind] || x.kind)}<br><span class="note">${day(x.created_at)}</span></span><span class="${x.amount < 0 ? "neg" : "pos"}">${x.amount < 0 ? "−" : "+"}${inr(Math.abs(x.amount))}</span></div>`).join("") || '<p class="mut">Your earnings and withdrawals will be listed here.</p>'}</div>`;
  const f = $("#wf");
  f.amt.oninput = () => {
    const a = +f.amt.value || 0;
    $("#pv").textContent = a ? `You will receive ${inr(a - a * pct / 100 - a * tds / 100)} after charges.` : `Admin charge ${pct}% is deducted from the amount.`;
  };
  f.onsubmit = e => {
    e.preventDefault();
    act($(".btn", f), async () => {
      await call(sb.rpc("request_withdrawal", {p_amount: +f.amt.value}));
      toast("Withdrawal requested."); await wallet();
    });
  };
}

async function profile() {
  $("#v").innerHTML = `<form id="pf" class="card"><h2>My profile</h2>
    <label>Full name<input name="full_name" value="${esc(me.full_name)}" required></label>
    <label>Mobile number<input name="mobile" inputmode="tel" value="${esc(me.mobile)}"></label>
    <label>Address<input name="address" value="${esc(me.address)}"></label>
    <label>Nominee name<input name="nominee_name" value="${esc(me.nominee_name)}"></label>
    <label>Nominee relation<input name="nominee_relation" value="${esc(me.nominee_relation)}"></label>
    <button class="btn">Save changes</button></form>
  <form id="pw" class="card"><h2>Change password</h2>
    <label>New password<input name="p" type="password" minlength="6" required autocomplete="new-password"></label>
    <button class="btn">Update password</button></form>
  <button class="link" id="lo">Log out</button>`;
  $("#lo").onclick = logout;
  $("#pf").onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    act($(".btn", e.target), async () => {
      await call(sb.from("members").update(v).eq("id", me.id));
      me = {...me, ...v}; toast("Changes saved.");
    });
  };
  $("#pw").onsubmit = e => {
    e.preventDefault();
    act($(".btn", e.target), async () => {
      await call(sb.auth.updateUser({password: new FormData(e.target).get("p")}));
      e.target.reset(); toast("Password updated.");
    });
  };
}

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") authView(); });
sb.auth.getSession().then(({data}) => data.session ? loadMe() : authView());
</script>
</body>
</html>
