<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17171b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OCTO7</title>
<style>
:root{--bg:#17171b;--card:#222228;--ink:#f1f2f6;--mut:#a7a9b4;--line:#34353d;--brand:#ffffff;--on:#17171b;--bad:#ff8a80;--l:#6c8cff;--r:#ffc20e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:.02em}
h2{font-size:1.05rem;margin:0 0 10px}
p{margin:0 0 8px}
.mut,.note{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.hero{background:#0f4aa0;color:#fff;border-radius:22px;padding:18px;margin:0 0 12px}
.bal{font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{display:flex;gap:3px;height:20px;margin:6px 0}
.bar i{background:var(--l);border-radius:10px 4px 4px 10px;min-width:6px}
.bar i.r{background:var(--r);border-radius:4px 10px 10px 4px}
.lr{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600}
label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mut)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:130px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:inherit;font-weight:700}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:10px}
.btn.white{background:#fff;color:#17171b}
.btn.ghost{background:#22232a;color:#ffffff;border:1px solid #ffffff}
.btn.ghost:active{background:#2a2b33}
.link{background:none;border:0;color:var(--brand);font:inherit;padding:10px 0;text-decoration:underline}
.auth{padding-top:8vh}
.back{padding:14px 0 0;text-decoration:none}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{color:#7ddc9a;font-weight:600}
.neg{color:var(--bad);font-weight:600}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.qty span{min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:.8rem;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mut);font:inherit;font-size:.9rem}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:528px;margin:auto;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.bad{background:var(--bad);color:#fff}
.tb{display:flex;align-items:center;gap:12px;background:var(--bg);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 14px;font-size:1.5rem;position:sticky;top:0;z-index:5}
.tb b{flex:1;font-weight:700;color:#fff;letter-spacing:.01em}
.menu{background:#fff;color:#17171b;border:0;border-radius:24px;padding:12px 18px;font:inherit;font-weight:700;flex-shrink:0;margin-left:auto}
.bk{background:none;border:0;color:#fff;font-size:2rem;padding:2px 8px;line-height:1}

.pt{display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top))}
.pt-top{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px}
.pt-top-title{font-size:1.25rem;font-weight:700;color:#fff;margin:0;line-height:1.2;opacity:1;transition:opacity .35s ease}
.pt-stage{position:relative;width:100%;margin-top:8px}
.pt-hero{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:7vh;transition:padding-top 1.1s cubic-bezier(.22,1,.36,1)}
.pt-brand-row{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;transition:gap 1.1s cubic-bezier(.22,1,.36,1)}
.plogo{width:min(44vw,180px);height:auto;transform:translateX(6%);flex-shrink:0;transition:width 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1)}
.pt-name-wrap{display:flex;flex-direction:column;align-items:center;min-width:0;transition:align-items 1.1s cubic-bezier(.22,1,.36,1)}
.pt-sub-label{font-size:.9rem;font-weight:600;color:var(--mut);line-height:1.15;max-height:0;opacity:0;margin:0;overflow:hidden;transition:max-height .55s ease,opacity .45s ease,margin .55s ease}
.pt .wl{display:block;color:#d1d5db;font-size:1.1rem;font-weight:600;opacity:1;max-height:2em;margin-bottom:4px;overflow:hidden;transition:opacity .45s ease,max-height .55s ease,margin .55s ease}
.pt h1.nm{color:#fff;font-weight:700;font-size:1.85rem;margin:0;line-height:1.18;transition:font-size 1.1s cubic-bezier(.22,1,.36,1)}
.pt .note{margin-top:14px;max-height:3em;opacity:1;overflow:hidden;transition:opacity .4s ease,max-height .45s ease,margin .45s ease}

.pt.settled .pt-top-title{opacity:0;flex:0 0 0;width:0;min-width:0;overflow:hidden;pointer-events:none}
.pt.settled .pt-hero{padding-top:0;align-items:flex-start;text-align:left}
.pt.settled .pt-brand-row{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.pt.settled .plogo{width:52px;transform:translateX(0)}
.pt.settled .pt-name-wrap{align-items:flex-start}
.pt.settled .pt-sub-label{max-height:1.5em;opacity:1;margin-bottom:2px}
.pt.settled .wl{opacity:0;max-height:0;margin:0;pointer-events:none}
.pt.settled h1.nm{font-size:1.45rem}
.pt.settled .note{opacity:0;max-height:0;margin:0;pointer-events:none}

.nm{color:#ffffff;font-weight:700}
.sec{color:var(--mut);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin:18px 0 8px}
.ctr{text-align:center}
.av{position:relative;width:96px;height:96px;margin:0 auto 10px;border-radius:50%;background:#0f4aa0;display:flex;align-items:center;justify-content:center;font-size:2.1rem;font-weight:700;border:1px solid rgba(255,255,255,.16)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.cam{position:absolute;right:-3px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:#fff;color:#17171b;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
[hidden]{display:none!important}
.idf{display:flex;align-items:stretch;margin-top:4px}
.idf span{display:flex;align-items:center;padding:0 12px;background:var(--line);border-radius:10px 0 0 10px;font-weight:700;color:#ffffff;font-size:.95rem}
.idf input{margin-top:0;border-radius:0 10px 10px 0}
.idf input[readonly]{opacity:.8}
.idl{display:inline-block;line-height:1.15;font-weight:700}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut);background:var(--bg)}
.bdg.ok{color:#7ddc9a;border-color:rgba(125,220,154,.35);background:rgba(125,220,154,.08)}
.ov .row{padding:11px 0;font-variant-numeric:tabular-nums}
.ov .row span:first-child{color:var(--mut);font-size:.86rem}
.ov .row b{font-size:.95rem;text-align:right;word-break:break-word}
.ov.pov-stack .row{flex-direction:column;align-items:flex-start;gap:4px}
.ov.pov-stack .row b{text-align:left;color:#ffffff}
.pdet-card .row.col{flex-direction:column;align-items:flex-start;gap:3px}
.pdet-card .row.col span,.pdet-card .row.col b,.pdet-card .row.col b *{text-align:left;word-break:break-word;font-size:1rem;color:#ffffff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));text-align:center}
.sheet canvas{width:280px;height:280px;border-radius:50%;touch-action:none;margin:0 auto 12px;display:block;background:#000}
.sheet input[type=range]{padding:0;margin:0 0 14px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{width:calc((100% - 20px) / 3);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;min-height:100px;padding:16px 6px 10px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:var(--card);color:#ffffff;font:inherit;font-size:.78rem;line-height:1.25;text-align:center;overflow-wrap:anywhere;transition:border-color .12s,background .12s}
.tile span{display:flex;color:#ffffff}
.tile:active,.tile:focus-visible{border-color:#ffffff;background:#2a2b33;outline:0;transform:scale(.98)}
.pw{position:relative}.pw input{padding-right:54px}
.eye{position:absolute;right:4px;top:calc(50% + 2px);transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--ink);font-size:1.25rem}
.bt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;min-height:84px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:.78rem;text-align:center;overflow-wrap:anywhere}
.nd b{font-size:.9rem}.nd span{color:#ffffff;font-size:.72rem}.nd small{color:var(--mut);font-size:.7rem}
.nd.vac{border-style:dashed;background:none;color:var(--mut)}.nd.vac b{font-size:1.5rem;color:#ffffff}
.nd.gap{border:0;background:none}.nd.root{border-color:#ffffff;background:#2a2b33}
select{-webkit-appearance:none;appearance:none;padding-right:42px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.w2{height:100vh;height:100dvh;width:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;text-align:center;padding:max(16px,env(safe-area-inset-top)) 22px max(10px,env(safe-area-inset-bottom));background:#17171b;color:#fff}
.w2 .wtop{width:100%;display:flex;justify-content:center;align-items:center}
.w2 .wtop img{display:block;width:auto;max-width:62vw;max-height:9dvh;margin:1dvh auto 0;object-fit:contain}
.w2 h1{font-size:2.6rem;letter-spacing:.08em;margin:2dvh 0 0;text-align:center}
.w2 .wmid{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:visible}
.w2 .wmid img{display:block;width:auto;height:auto;max-width:72vw;max-height:34dvh;margin:0 auto;object-fit:contain;overflow:visible;transform:translateX(6%)}
.w2 .wbot{width:100%;max-width:440px;margin:0 auto}
.signin{display:block;width:100%;padding:15px;border:0;border-radius:40px;background:#fff;color:#1b2440;font:inherit;font-size:1.5rem;font-weight:600}
.su{color:#e8e9ee;margin:12px 0 8px;font-size:1.02rem}
.sup{background:none;border:0;color:#fff;font:inherit;font-weight:700;text-decoration:underline;padding:0}
.wf{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:clamp(12.5px,3.7vw,14px)}
.wf button{background:none;border:0;color:#fff;font:inherit;font-weight:700;padding:10px 2px;white-space:nowrap}
#splash{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:#17171b;display:flex;align-items:center;justify-content:center;z-index:60;opacity:1}
#splash img{width:min(60vw,280px);border-radius:36px;opacity:0;transform:scale(.35);will-change:transform,opacity}
#splash img.go{animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.35)}25%{opacity:1}100%{opacity:1;transform:scale(1)}}
#splash.out{opacity:0;pointer-events:none}
#app.over{position:relative;z-index:61;background:#17171b;min-height:100dvh}
@media (prefers-reduced-motion:reduce){
  #splash img.go{animation:none!important;opacity:1!important;transform:none!important}
  #splash{transition:none!important}
  .pt-top-title,.pt-hero,.pt-brand-row,.plogo,.pt-name-wrap,.pt-sub-label,.pt .wl,.pt h1.nm,.pt .note{transition:none!important}
}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="splash" hidden><img src="splash.webp" alt="OCTO7"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = "https://xqckhmrzdzhsdronrbow.supabase.co", SB_KEY = "sb_publishable_kvOcNoJlS_YTk0vf8N4HBg_WWrWLsGp";
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 2});
const idRest = v => String(v || "").trim().toUpperCase().replace(/^OCTO7/, "");
const fullId = v => idRest(v) ? "OCTO7" + idRest(v) : "";
const idStack = c => { c = String(c || ""); return c.startsWith("OCTO7") ? `<span class="idl">OCTO7<br>${esc(c.slice(5))}</span>` : esc(c); };
const idField = (n, l, req = true, val = "") => `<label>${l}<div class="idf"><span>OCTO7</span><input name="${n}" value="${esc(val)}"${req ? " required" : ""} autocapitalize="characters" autocomplete="off"></div></label>`;
const pwf = (n, l, ac, min = 6) => `<label>${l}<div class="pw"><input name="${n}" type="password" minlength="${min}" required autocomplete="${ac}"><button type="button" class="eye" aria-label="Show">👁️</button></div></label>`;
document.addEventListener("click", e => {
  const b = e.target.closest(".eye"); if (!b) return;
  const i = b.previousElementSibling, hide = i.type === "password";
  i.type = hide ? "text" : "password"; b.textContent = hide ? "🙈" : "👁️"; b.setAttribute("aria-label", hide ? "Hide" : "Show");
});
const day = d => new Date(d).toLocaleDateString("en-IN", {day: "numeric", month: "short"});
const STATUS = {placed: "Placed", paid: "Paid", shipped: "Shipped", delivered: "Delivered", cancelled: "Cancelled", returned: "Returned"};
const KIND = {binary_commission: "Binary income", sponsor_bonus: "Sponsor bonus", withdrawal: "Withdrawal", withdrawal_refund: "Withdrawal refund"};
let me = null, cfg = {}, cart = {};

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 3800);
}
async function call(p) {
  const {data, error} = await p;
  if (error) { toast(error.message, true); throw error; }
  return data;
}
async function act(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) {} finally { btn.disabled = false; }
}

function welcomeView() {
  app.innerHTML = `<div class="w2"><div class="wtop"><img src="wordmark.webp" alt="OCTO7" onerror="this.replaceWith(Object.assign(document.createElement('h1'),{textContent:'OCTO7'}))"></div>
  <div class="wmid"><img src="globe.webp" alt="OCTO7 logo" onerror="this.remove()"></div>
  <div class="wbot"><button class="signin" id="si">Sign In</button><p class="su">Don’t have an account? <button class="sup" id="su">Sign Up</button></p>
  <div class="wf">${[["about", "About us"], ["products", "Products"], ["opp", "Opportunity"], ["contact", "Contact us"]].map(([k, l], i) => `${i ? " | " : ""}<button data-k="${k}">${l}</button>`).join("")}</div></div></div>`;
  $("#si").onclick = () => authView("login");
  $("#su").onclick = () => authView("reg");
  app.querySelectorAll(".wf button").forEach(b => b.onclick = () => pubView(b.dataset.k));
}
const PUBT = {about: "About us", products: "Products", opp: "Opportunity", contact: "Contact us"};
async function pubView(k) {
  app.innerHTML = `<div class="tb"><button class="bk" id="bk" aria-label="Back">←</button><b>${PUBT[k]}</b></div><main id="v"><p class="mut">Loading…</p></main>`;
  $("#bk").onclick = welcomeView;
  const blk = t => t ? `<div class="card" style="white-space:pre-wrap">${esc(t)}</div>` : '<div class="card"><p class="mut">This information will be added soon.</p></div>';
  if (k === "products") {
    const {data} = await sb.from("products").select("id,name,description,price").eq("active", true).order("created_at");
    $("#v").innerHTML = (data || []).map(x => `<div class="card"><b>${esc(x.name)}</b><br><span class="note">${esc(x.description || "")}</span><br><b>${inr(x.price)}</b></div>`).join("") || blk("");
    return;
  }
  const i = (await sb.rpc("public_info")).data || {};
  if (k === "about") $("#v").innerHTML = blk(i.about_text);
  else if (k === "opp") $("#v").innerHTML = blk(i.opportunity_text);
  else $("#v").innerHTML = `<div class="card">${i.help_phone ? `<div class="row"><span>Phone</span><a class="link" href="tel:${esc(i.help_phone)}">${esc(i.help_phone)}</a></div>` : ""}${i.help_email ? `<div class="row"><span>Email</span><a class="link" href="mailto:${esc(i.help_email)}">${esc(i.help_email)}</a></div>` : ""}${i.help_hours ? `<div class="row"><span>Hours</span><b>${esc(i.help_hours)}</b></div>` : ""}${i.help_phone || i.help_email || i.help_hours ? "" : '<p class="mut">Contact details will be added soon.</p>'}</div>`;
}

function authView(mode = "login") {
  if (mode === "reg") return regView();
  app.innerHTML = `<main class="auth"><button class="link back" id="bk">Back</button>
  <h2 style="font-size:1.6rem;margin:6px 0 12px">Member login</h2>
  <form id="f" class="card">${idField("uid", "User ID")}${pwf("pw", "Password", "current-password")}<button class="btn">Log in</button></form>
  <button class="link" id="sw">New member? Register</button></main>`;
  $("#bk").onclick = welcomeView; $("#sw").onclick = () => authView("reg");
  $("#f").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    act($(".btn"), async () => {
      const password = f.get("pw");
      const em = await call(sb.rpc("login_email", {p_code: fullId(f.get("uid")), p_password: password}));
      if (!em) { toast("Wrong user ID or password.", true); return; }
      if (em === "LOCKED") { toast("Too many wrong attempts. Please try again after 15 minutes.", true); return; }
      const {error} = await sb.auth.signInWithPassword(em.startsWith("tel:") ? {phone: "+" + em.slice(4), password} : {email: em, password});
      if (error) { toast(error.message, true); return; }
      await loadMe();
    });
  };
}

function regHtml(c) {
  const slot = c.mode === "slot";
  return `<form id="rf" class="card">
    <label>Full name<input name="name" required autocomplete="off"></label>
    <label>Mobile number<input name="mobile" inputmode="tel" required autocomplete="off"></label>
    <label>Email address (optional)<input name="email" type="email" autocomplete="off"></label>
    ${idField("sp", "Sponsor ID", true, idRest(c.sponsor))}
    ${c.mode === "menu" ? `<label>Placement ID<select name="pa" id="pa">${c.slots.map(x => `<option value="${esc(x.code)}">${esc(x.code)}${x.name ? " - " + esc(x.name) : ""}</option>`).join("")}</select></label>` : ""}
    ${slot ? `<label>Placement ID<div class="idf"><span>OCTO7</span><input value="${esc(idRest(c.parent))}" readonly></div></label><p class="note" style="margin:-6px 0 12px">The new member is placed on the ${c.side === "R" ? "right" : "left"} under this ID.</p>`
      : `<label>${c.mode === "menu" ? "Side" : "Side under your sponsor"}<select name="side"><option value="L">Left</option><option value="R">Right</option></select></label>`}
    ${pwf("pw", "New password", "new-password")}${pwf("pw2", "Confirm password", "new-password")}
    <label>Verification<select name="otpm"><option value="" disabled selected>Enter OTP</option><option value="email">Email OTP</option><option value="sms">SMS OTP</option></select></label>
    <button class="btn" type="button" id="so">Send OTP</button>
    <div id="ob" hidden><label style="margin-top:14px">Type OTP<input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label><button class="btn white" type="button" id="co">Confirm OTP</button></div></form>`;
}
function regLogic(c) {
  const f = $("#rf"); let ctx = null;
  $("#so").onclick = e => act(e.target, async () => {

  if (me.status === "blocked") return gate("Account blocked", "Please contact the company help line.");
  if (!me.parent_id && me.status !== "active") return placeFlow(user);

const toBlob = (c, q) => new Promise(r => c.toBlob(r, "image/jpeg", q));
function cropper(src, onSave) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet"><canvas id="cv" width="280" height="280"></canvas><input type="range" id="zm" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><button class="btn" id="sv">Save photo</button><button class="link" id="cn">Cancel</button></div>`;
  document.body.appendChild(m);
  const cv = $("#cv", m), x = cv.getContext("2d"), V = 280, img = new Image();
  let z = 1, ox = 0, oy = 0, drag = null;
  const dims = () => { const k = Math.max(V / img.width, V / img.height) * z; return [img.width * k, img.height * k]; };
  const draw = () => { const [w, h] = dims(); ox = Math.min(0, Math.max(V - w, ox)); oy = Math.min(0, Math.max(V - h, oy)); x.fillStyle = "#000"; x.fillRect(0, 0, V, V); x.drawImage(img, ox, oy, w, h); };
  img.onload = () => { const [w, h] = dims(); ox = (V - w) / 2; oy = (V - h) / 2; draw(); };
  img.onerror = () => { m.remove(); toast("Could not open this photo.", true); };
  img.src = src;
  cv.onpointerdown = e => { drag = [e.clientX - ox, e.clientY - oy]; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (drag) { ox = e.clientX - drag[0]; oy = e.clientY - drag[1]; draw(); } };
  cv.onpointerup = () => { drag = null; };
  $("#zm", m).oninput = e => {
    const [w0, h0] = dims(), cx = (V / 2 - ox) / w0, cy = (V / 2 - oy) / h0;
    z = +e.target.value; const [w, h] = dims(); ox = V / 2 - cx * w; oy = V / 2 - cy * h; draw();
  };
  $("#cn", m).onclick = () => m.remove();
  $("#sv", m).onclick = () => act($("#sv", m), async () => {
    const o = document.createElement("canvas"); o.width = o.height = 360;
    const f = 360 / V, [w, h] = dims();
    o.getContext("2d").drawImage(img, ox * f, oy * f, w * f, h * f);
    let blob = await toBlob(o, 0.72);
    if (blob && blob.size > 122880) blob = await toBlob(o, 0.55);
    if (!blob) { toast("Could not save the photo.", true); return; }
    await onSave(blob); m.remove();
  });
}

function shrink(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Could not read the photo.")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("Could not read the photo.")); img.src = u;
  });
}

    ["BV Calculation & Matching", [["All Members BV Summary"], ["Daily BV Calculation", "bvrun"], ["Left BV & Right BV"], ["First Match 2:1 / 1:2"], ["Subsequent Matching 1:1"], ["Matched BV"], ["Unmatched BV"], ["Carry Forward BV"], ["Forfeited BV"], ["Daily Capping"], ["Eligible BV For Commission"]]],
    ["Payment Verification"], ["Bank Transfer Management"], ["Member Wallet"], ["Commission Calculation"], ["Withdrawal Management", "wdm"], ["Child ID to Main ID Transfers"],
    ["Refund Management"], ["Daily Accounts"], ["Financial Reports"], ["Tax & Compliance Accounts"], ["Audit & Reconciliation"]]],
  ["Coupons & Pins Management", [["Coupon & Pin Dashboard", "cpd"], ["Generate Pin & Distribution", "cpg"], ["Coupon & Pin History", "cph"]]],
  ["Sales Department", [["Orders & Delivery", "ords"]]], ["Marketing Department"], ["Member Relations", [["KYC Review", "kycr"]]], ["Network Department"], ["Customer Support"], ["IT & Software"],
  ["Product Management", [["Products", "prodm"]]], ["Purchase & Procurement"], ["Inventory & Warehouse"], ["Logistics & Distribution"], ["Legal & Compliance"], ["Quality Control"], ["Training & Development"]];
const adm = () => { if (!isAdmin) { go("portal", false); throw new Error("not allowed"); } };
async function mmap(ids) {
  const u = [...new Set(ids)]; if (!u.length) return {};
  const {data} = await sb.from("members").select("id,member_code,full_name").in("id", u);
  return Object.fromEntries((data || []).map(m => [m.id, m]));
}
const mc = m => m ? `${esc(m.member_code)} ${esc(m.full_name || "")}` : "";
const FAI = {"Human Resource (HR)": "briefcase", "Administration": "tool", "Accounts & Finance": "wallet", "Coupons & Pins Management": "ticket", "Sales Department": "trend", "Marketing Department": "megaphone",
  "Member Relations": "smile", "Network Department": "globe", "Customer Support": "headset", "IT & Software": "monitor", "Product Management": "package", "Purchase & Procurement": "clipboard",
  "Inventory & Warehouse": "archive", "Logistics & Distribution": "truck", "Legal & Compliance": "scale", "Quality Control": "search", "Training & Development": "book",
  "BV Calculation & Matching": "chart", "Withdrawal Management": "card", "Member Wallet": "wallet"};
async function fa() {
  adm();
  let list = FA; for (const i of faPath) list = list[i][1];
  tiles(list.map(m => [FAI[m[0]] || (Array.isArray(m[1]) ? "folder" : "file"), m[0]]), i => {
    const m = list[i];
    if (Array.isArray(m[1])) { faPath.push(i); render(); }
    else { soonT = m[0]; hist.push("fa"); go(m[1] || "soon", false); }
  });
}
async function cpd() {
  adm();
  const p = await call(sb.from("coupon_pins").select("*").order("created_at", {ascending: false}).limit(1000));
  const M = await mmap(p.map(x => x.owner_id)), by = {};
  p.forEach(x => by[x.owner_id] = (by[x.owner_id] || 0) + 1);
  $("#v").innerHTML = `<div class="card"><h2>Coupon and pin overview</h2><div class="row"><span>Pins created</span><b>${p.length}</b></div><div class="row"><span>Unused</span><b>${p.filter(x => x.status === "unused").length}</b></div><div class="row"><span>Used</span><b>${p.filter(x => x.status === "used").length}</b></div></div>
  <div class="card"><h2>Member wise pin distribution</h2>${Object.entries(by).map(([id, n]) => `<div class="row"><span>${mc(M[id])}</span><b>${n}</b></div>`).join("") || '<p class="mut">No pins yet.</p>'}</div>
  <div class="card"><h2>Recent pin activity</h2>${p.slice(0, 10).map(x => `<div class="row"><span>${mc(M[x.owner_id])}<br><span class="note">${x.coupon_type} coupon, ${day(x.created_at)}</span></span><span class="tag">${x.status}</span></div>`).join("") || '<p class="mut">No activity yet.</p>'}</div>`;
}
async function cpg() {
  adm();
  $("#v").innerHTML = `<form id="gf" class="card"><h2>Generate pin and transfer to member</h2>${idField("uid", "Member user ID")}
  <label>Redeem coupon quantity<input name="r" type="number" min="0" max="500" value="0" inputmode="numeric"></label>
  <label>Discount coupon quantity<input name="d" type="number" min="0" max="500" value="0" inputmode="numeric"></label>
  <button class="btn">Generate and transfer pin</button></form>`;
  $("#gf").onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    act($(".btn"), async () => {
      const n = await call(sb.rpc("generate_and_transfer_pins", {p_member_code: fullId(f.get("uid")), p_redeem_qty: +f.get("r") || 0, p_discount_qty: +f.get("d") || 0}));
      toast(`${n} pin(s) sent to the member.`); e.target.reset();
    });
  };
}
async function cph() {
  adm();
  const p = await call(sb.from("coupon_pins").select("*").order("created_at", {ascending: false}).limit(200));
  const M = await mmap(p.flatMap(x => [x.owner_id, x.used_by].filter(Boolean)));
  $("#v").innerHTML = `<div class="card">${p.map(x => `<div class="row"><span>${mc(M[x.owner_id])}<br><span class="note">${x.coupon_type} coupon, ${day(x.created_at)}${x.used_by ? ", used by " + mc(M[x.used_by]) : ""}</span></span><span class="tag">${x.status}</span></div>`).join("") || '<p class="mut">No pins have been created yet.</p>'}</div>`;
}
function actions(rpc, key, reload) {
  $("#v").querySelectorAll("[data-s]").forEach(b => b.onclick = () => act(b, async () => {
    if (/rejected|cancelled|returned/.test(b.dataset.s) && !confirm("Are you sure?")) return;
    await call(sb.rpc(rpc, {[key]: b.dataset.id, p_status: b.dataset.s})); toast("Updated."); await reload();
  }));
}
const btns = (id, list) => list.map(s => `<button class="btn" data-id="${id}" data-s="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join("");
async function wdm() {
  adm();
  const w = await call(sb.from("withdrawals").select("*").order("created_at", {ascending: false}).limit(100));
  const M = await mmap(w.map(x => x.member_id)), NX = {requested: ["approved", "paid", "rejected"], approved: ["paid", "rejected"]};
  $("#v").innerHTML = w.map(x => `<div class="card"><div class="row" style="border:0"><span>${mc(M[x.member_id])}<br><span class="note">${day(x.created_at)}, pay ${inr(x.net_amount)} of ${inr(x.amount)}</span></span><span class="tag">${x.status}</span></div>${btns(x.id, NX[x.status] || [])}</div>`).join("") || '<p class="mut">No withdrawal requests.</p>';
  actions("admin_set_withdrawal_status", "p_id", wdm);
}
async function ords() {
  adm();
  const o = await call(sb.from("orders").select("*").order("created_at", {ascending: false}).limit(50));
  const M = await mmap(o.map(x => x.member_id)), NX = {placed: ["paid", "cancelled"], paid: ["shipped", "delivered", "cancelled"], shipped: ["delivered", "cancelled"], delivered: ["returned"]};
  $("#v").innerHTML = o.map(x => `<div class="card"><div class="row" style="border:0"><span>${mc(M[x.member_id])}<br><span class="note">${day(x.created_at)}, ${inr(x.total)}</span></span><span class="tag">${STATUS[x.status] || x.status}</span></div>${btns(x.id, NX[x.status] || [])}</div>`).join("") || '<p class="mut">No orders yet.</p>';
  actions("admin_set_order_status", "p_order", ords);
}
async function kycr() {
  adm();
  const k = await call(sb.from("kyc").select("*").order("updated_at", {ascending: false}).limit(30));
  const M = await mmap(k.map(x => x.member_id)), L = {};
  for (const x of k) for (const f of ["passbook", "aadhaar", "pan"]) if (x[f + "_path"]) L[x.member_id + f] = (await sb.storage.from("kyc").createSignedUrl(x[f + "_path"], 600)).data?.signedUrl;
  $("#v").innerHTML = k.map(x => `<div class="card"><div class="row" style="border:0"><span>${mc(M[x.member_id])}<br><span class="note">${esc(x.bank_name || "")} ${esc(x.account_number || "")} ${esc(x.ifsc || "")}<br>PAN ${esc(x.pan_number || "")}</span></span><span class="tag">${x.status}</span></div>
    <p>${["passbook", "aadhaar", "pan"].map(f => L[x.member_id + f] ? `<a class="link" target="_blank" rel="noopener" href="${esc(L[x.member_id + f])}">${f}</a> ` : "").join("")}</p>
    ${btns(x.member_id, ["approved", "rejected"].filter(s => s !== x.status))}</div>`).join("") || '<p class="mut">No KYC submissions yet.</p>';
  $("#v").querySelectorAll("[data-s]").forEach(b => b.onclick = () => act(b, async () => {
    await call(sb.rpc("admin_review_kyc", {p_member: b.dataset.id, p_status: b.dataset.s})); toast("Updated."); await kycr();
  }));
}
async function prodm() {
  adm();
  const p = await call(sb.from("products").select("*").order("created_at", {ascending: false}));
  $("#v").innerHTML = `<form id="pf2" class="card"><h2>Add a product</h2><label>Name<input name="name" required></label><label>Description<input name="description"></label>
    <label>Price (₹)<input name="price" type="number" min="1" step="0.01" required inputmode="decimal"></label><label>PV (business volume)<input name="pv" type="number" min="0" step="0.01" value="0" required inputmode="decimal"></label>
    <button class="btn">Add product</button></form>
  ${p.map(x => `<div class="card"><div class="row" style="border:0"><span><b>${esc(x.name)}</b><br><span class="note">${inr(x.price)}, ${+x.pv} PV</span></span><button class="link" data-id="${x.id}" data-a="${x.active ? 0 : 1}">${x.active ? "Hide" : "Show"}</button></div></div>`).join("")}`;
  $("#pf2").onsubmit = e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    act($(".btn"), async () => { await call(sb.from("products").insert({name: f.name.trim(), description: f.description.trim() || null, price: +f.price, pv: +f.pv})); toast("Product added."); await prodm(); });
  };
  $("#v").querySelectorAll("[data-a]").forEach(b => b.onclick = () => act(b, async () => { await call(sb.from("products").update({active: b.dataset.a === "1"}).eq("id", b.dataset.id)); await prodm(); }));
}
async function bvrun() {
  adm();
  const t = new Date(Date.now() + 5.5 * 3600e3); t.setUTCDate(t.getUTCDate() - 1);
  const r = await call(sb.from("binary_runs").select("*").order("run_date", {ascending: false}).limit(15));
  $("#v").innerHTML = `<form id="bf2" class="card"><h2>Daily BV calculation</h2><p class="note">Run once for each finished day (Indian time). A day cannot be run twice.</p>
    <label>Day<input name="d" type="date" value="${t.toISOString().slice(0, 10)}" required></label><button class="btn">Run matching for this day</button></form>
  <div class="card"><h2>Days already run</h2>${r.map(x => `<div class="row"><span>${esc(x.run_date)}</span><span class="note">${day(x.ran_at)}</span></div>`).join("") || '<p class="mut">None yet.</p>'}</div>`;
  $("#bf2").onsubmit = e => {
    e.preventDefault();
    act($(".btn"), async () => { const n = await call(sb.rpc("run_daily_binary_matching", {p_run_date: new FormData(e.target).get("d")})); toast(`Done. ${n} members processed.`); await bvrun(); });
  };
}
async function pubedit() {
  adm();
  const i = (await sb.rpc("public_info")).data || {};
  $("#v").innerHTML = `<form id="pe" class="card"><h2>Pages on the welcome screen</h2><p class="note">Have the wording checked by your legal adviser before you publish it.</p>
    <label>About us<textarea name="about_text">${esc(i.about_text)}</textarea></label><label>Opportunity<textarea name="opportunity_text">${esc(i.opportunity_text)}</textarea></label>
    <label>Contact phone<input name="help_phone" value="${esc(i.help_phone)}"></label><label>Contact email<input name="help_email" type="email" value="${esc(i.help_email)}"></label>
    <label>Contact hours<input name="help_hours" value="${esc(i.help_hours)}"></label><button class="btn">Save</button></form>`;
  $("#pe").onsubmit = e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    act($(".btn"), async () => { for (const [k, v] of Object.entries(d)) await call(sb.from("app_settings").update({value: v.trim()}).eq("key", k)); Object.assign(cfg, d); toast("Saved."); });
  };
}

const start = () => {
  if (!sb || !sb.auth || !sb.auth.getSession) return welcomeView();
  return sb.auth.getSession().then(({data}) => data && data.session ? loadMe() : welcomeView()).catch(() => welcomeView());
};
if (sb && sb.auth && sb.auth.onAuthStateChange) {
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") welcomeView(); });
}

const params = new URLSearchParams(location.search);
if (params.get("nosplash") === "1") {
  const sp = $("#splash"); if (sp) sp.remove();
  start();
} else {
  const sp = $("#splash"), im = $("img", sp);
  sp.hidden = false;
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    app.classList.add("over");
    start();
    if (sp) sp.remove();
    setTimeout(() => app.classList.remove("over"), 50);
  };
  const run = () => { im.classList.add("go"); setTimeout(finish, 2400); setTimeout(finish, 3500); };
  im.onerror = finish;
  if (im.complete && im.naturalWidth) run(); else im.onload = run;
}
</script>
<script src="ids.js"></script>
</body>
