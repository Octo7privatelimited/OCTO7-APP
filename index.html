<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a8f">
<title>OCTO7</title>
<style>
:root{--bg:#0a1a33;--card:#1a2740;--ink:#f1f4fb;--mut:#a9b4cc;--line:#2a3a5c;--brand:#ffc20e;--on:#16130a;--bad:#ff8a80;--l:#6c8cff;--r:#ffc20e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:0}
header{display:flex;justify-content:space-between;align-items:baseline;max-width:560px;margin:0 auto;padding:14px 16px 4px}
header span{color:var(--mut);font-size:.9rem;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:8px 16px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:.02em}
h2{font-size:1.05rem;margin:0 0 10px}
p{margin:0 0 8px}
.mut,.note{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.hero{background:#0f4aa0;color:#fff;border-radius:22px;padding:18px;margin:0 0 12px}
.bal{font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{display:flex;gap:3px;height:20px;margin:6px 0}
.bar i{background:var(--l);border-radius:10px 4px 4px 10px;min-width:6px}
.bar i.r{background:var(--r);border-radius:4px 10px 10px 4px}
.lr{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600}
label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mut)}
input,select{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font:inherit;font-weight:700}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--brand);font:inherit;padding:10px 0;text-decoration:underline}
.auth{padding-top:8vh}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{color:#1b7f3b;font-weight:600}.neg{color:var(--bad);font-weight:600}
.pos{color:#7ddc9a}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem}
.qty span{min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.tag{font-size:.8rem;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.tag.L{border-color:var(--l)}.tag.R{border-color:var(--r)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mut);font:inherit;font-size:.9rem}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:528px;margin:auto;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--bad);color:#fff}
.back{padding:14px 0 0;text-decoration:none}
.wel{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:20px;text-align:center;padding:max(28px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom));background:radial-gradient(130% 55% at 50% 30%,#18356f 0,#0a1233 58%,#050816 100%) #050816;color:#fff}
.wel .hd{padding-top:3vh}
.wel .hd small{display:block;font-size:1rem;color:#b9c4ee;letter-spacing:.08em}
.wel .hd b{display:block;font-size:3.4rem;line-height:1.05;letter-spacing:.07em;font-weight:800}
.wel .lg{width:min(54vw,210px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 90px 14px rgba(60,110,230,.38)}
.wel .lg img{display:block;width:100%;height:100%}
.wel .slogan{font:italic 1.35rem/1.3 Georgia,"Times New Roman",serif;color:#f0cf7d;margin:0}
.wel .sub{color:#c9d3f5;font-size:.95rem;max-width:30ch;margin:6px auto 0}
.wel .acts{width:100%;max-width:420px}
.wb{display:block;width:100%;padding:16px;border-radius:30px;font:inherit;font-weight:700;font-size:1.1rem;margin:0 0 12px;border:2px solid #e9c46a}
.wb.g{background:linear-gradient(#f3d98b,#d9ae4a);color:#1a1405}
.wb.p{background:transparent;color:#f0cf7d}
.wel .nt{color:#aab6e6;font-size:.85rem;margin:2px 0 0}
.wel .ft{color:#c9d3f5;font-size:.85rem;letter-spacing:.05em}
.tb{display:flex;align-items:center;gap:12px;background:#0f4aa0;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:1.25rem;position:sticky;top:0;z-index:5}
.tb b{flex:1;font-weight:500}
.menu{background:#ffc20e;color:#16130a;border:0;border-radius:24px;padding:12px 18px;font:inherit;font-weight:700}
.bk{background:none;border:0;color:#fff;font-size:1.7rem;padding:2px 8px;line-height:1}
.mi{display:flex;align-items:center;gap:18px;width:100%;padding:15px 8px;background:none;border:0;color:var(--ink);font:inherit;font-size:1.1rem;text-align:left;letter-spacing:.02em}
.mi span{width:32px;text-align:center;font-size:1.4rem}
.pt{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.plogo{width:min(46vw,190px);margin-bottom:18px}
.nm{color:#19f3ff;font-weight:700}
.id{color:#f9c929}
h1.nm{font-size:1.9rem;margin:6px 0}
.f{display:block}.f b{display:block;font-size:1.05rem;margin-top:2px;word-break:break-word}
.sec{color:#f9c929;font-size:1.15rem;margin:22px 0 10px}
.ctr{text-align:center}
.av{position:relative;width:120px;height:120px;margin:4px auto 10px;border-radius:50%;background:#0f4aa0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.cam{position:absolute;right:-4px;bottom:0;width:44px;height:44px;border-radius:50%;background:#ffc20e;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.phl{color:#8c9bff;font-weight:700;letter-spacing:.03em}
.btn+.btn{margin-top:10px}
[hidden]{display:none!important}
.idf{display:flex;align-items:stretch;margin-top:4px}
.idf span{display:flex;align-items:center;padding:0 12px;background:var(--line);border-radius:10px 0 0 10px;font-weight:700;color:#f9c929;font-size:.95rem}
.idf input{margin-top:0;border-radius:0 10px 10px 0}
.idl{display:inline-block;line-height:1.15;font-weight:700}
button.cam{border:0;color:#16130a;font-size:1.3rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));text-align:center}
.sheet canvas{width:280px;height:280px;border-radius:50%;touch-action:none;margin:0 auto 12px;display:block;background:#000}
.sheet input[type=range]{padding:0;margin:0 0 14px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{width:calc((100% - 20px) / 3);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;min-height:100px;padding:16px 6px 10px;border:1px solid rgba(197,160,89,.3);border-radius:14px;background:var(--card);color:#e8ecf7;font:inherit;font-size:.78rem;line-height:1.25;text-align:center;overflow-wrap:anywhere;transition:border-color .12s,background .12s}
.tile span{display:flex;color:#c5a059}
.tile:active,.tile:focus-visible{border-color:#f0cf7d;background:#243453;outline:0;transform:scale(.98)}
.wl{color:#ff00ff}
.pw{position:relative}.pw input{padding-right:54px}
.eye{position:absolute;right:4px;top:calc(50% + 2px);transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--ink);font-size:1.25rem}
.btn.gold{background:#c5a059;color:#111827}
.btn.ghost{background:#1b2a45;color:#c5a059;border:1px solid #c5a059}
.btn.ghost:active{background:#243453;border-color:#f0cf7d}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://xqckhmrzdzhsdronrbow.supabase.co", "sb_publishable_kvOcNoJlS_YTk0vf8N4HBg_WWrWLsGp");
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 2});
const idRest = v => String(v || "").trim().toUpperCase().replace(/^OCTO7/, "");
const fullId = v => idRest(v) ? "OCTO7" + idRest(v) : "";
const idHtml = c => { c = String(c || ""); return c.startsWith("OCTO7") ? `<span class="idl">OCTO7<br>${esc(c.slice(5))}</span>` : esc(c); };
const idField = (n, l, req = true, val = "") => `<label>${l}<div class="idf"><span>OCTO7</span><input name="${n}" value="${esc(val)}"${req ? " required" : ""} autocapitalize="characters" autocomplete="off"></div></label>`;
const pwf = (n, l, ac, min = 6) => `<label>${l}<div class="pw"><input name="${n}" type="password" minlength="${min}" required autocomplete="${ac}"><button type="button" class="eye" aria-label="Show">👁️</button></div></label>`;
document.addEventListener("click", e => {
  const b = e.target.closest(".eye"); if (!b) return;
  const i = b.previousElementSibling, hide = i.type === "password";
  i.type = hide ? "text" : "password"; b.textContent = hide ? "🙈" : "👁️"; b.setAttribute("aria-label", hide ? "Hide" : "Show");
});
const day = d => new Date(d).toLocaleDateString("en-IN", {day: "numeric", month: "short"});
let me = null, cfg = {}, tab = "home", cart = {};

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 3800);
}
async function call(p) {
  const {data, error} = await p;
  if (error) { toast(error.message, true); throw error; }
  return data;
}
async function act(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) {} finally { btn.disabled = false; }
}

/* ---------- welcome / sign in / register ---------- */
function welcomeView() {
  app.innerHTML = `<div class="wel"><div class="hd"><small>Welcome to</small><b>OCTO7</b></div>
  <div><div class="lg"><img src="logo.png" alt="OCTO7 logo" width="210" height="210" onerror="this.parentNode.remove()"></div>
  <p class="slogan" style="margin-top:20px">Together for a better tomorrow</p>
  <p class="sub">Quality garments, entrepreneurship and a growing network.</p></div>
  <div class="acts"><button class="wb g" id="bl">Member Login</button><button class="wb p" id="br">New Member Registration</button>
  <p class="nt">A sponsor ID is needed to register. No sponsor ID? Contact the company.</p></div>
  <div class="ft">OCTO7 India • Dream • Network • Grow</div></div>`;
  $("#bl").onclick = () => authView("login");
  $("#br").onclick = () => authView("reg");
}

function authView(mode = "login") {
  const reg = mode === "reg";
  app.innerHTML = `<main class="auth"><button class="link back" id="bk">Back</button>
  <h2 style="font-size:1.6rem;margin:6px 0 12px">${reg ? "New member registration" : "Member login"}</h2>
  <form id="f" class="card">
    ${reg ? `${idField("sp", "Sponsor ID")}
    <p class="note" style="margin:-6px 0 12px">You need a sponsor ID to register. If you do not have one, contact the company and they will give you one.</p>
    <label>Full name<input name="name" required autocomplete="name"></label>
    <label>Mobile number<input name="mobile" inputmode="tel" required autocomplete="tel"></label>` : ""}
    ${reg ? '<label>Email<input name="email" type="email" required autocomplete="email"></label>' : idField("uid", "User ID")}
    ${pwf("pw", "Password", reg ? "new-password" : "current-password")}
    ${reg ? `<label>Side under your sponsor<select name="side"><option value="L">Left</option><option value="R">Right</option></select></label>` : ""}
    <button class="btn">${reg ? "Register" : "Log in"}</button>
  </form>
  <button class="link" id="sw">${reg ? "I already have an account" : "New member? Register"}</button></main>`;
  $("#bk").onclick = welcomeView;
  $("#sw").onclick = () => authView(reg ? "login" : "reg");
  $("#f").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), btn = $(".btn");
    act(btn, async () => {
      const password = f.get("pw");
      if (reg) {
        const email = f.get("email").trim();
        const sp = fullId(f.get("sp"));
        if (!(await call(sb.rpc("check_sponsor", {p_code: sp})))) { toast("Sponsor ID not found. Check it or contact the company.", true); return; }
        const {data, error} = await sb.auth.signUp({email, password, options: {data: {full_name: f.get("name").trim(), mobile: f.get("mobile").trim(), sponsor_code: sp, side: f.get("side")}}});
        if (error) { toast(error.message, true); return; }
        if (data.session) await loadMe();
        else { toast("Registration received. Confirm the email we sent, then log in."); authView("login"); }
      } else {
        const em = await call(sb.rpc("login_email", {p_code: fullId(f.get("uid")), p_password: password}));
        if (!em) { toast("Wrong user ID or password.", true); return; }
        if (em === "LOCKED") { toast("Too many wrong attempts. Please try again after 15 minutes.", true); return; }
        const {error} = await sb.auth.signInWithPassword({email: em, password});
        if (error) { toast(error.message, true); return; }
        await loadMe();
      }
    });
  };
}

/* ---------- after sign in ---------- */
async function loadMe() {
  const {data: {user}} = await sb.auth.getUser();
  if (!user) return welcomeView();
  const {data} = await sb.from("members").select("*").eq("id", user.id).maybeSingle();
  if (!data) { toast("Your profile is not ready yet. Try again in a moment.", true); return welcomeView(); }
  me = data;
  const s = await sb.from("app_settings").select("key,value");
  cfg = Object.fromEntries((s.data || []).map(r => [r.key, r.value]));
  if (me.status === "blocked") return gate("Account blocked", "Please contact the company help line.");
  if (!me.parent_id && me.status !== "active") return placeFlow(user);
  if (me.status === "pending") return activateView();
  authUser = user;
  isAdmin = (await sb.rpc("is_admin")).data === true;
  page = "portal"; hist = [];
  render();
}
function gate(title, text, again) {
  app.innerHTML = `<main class="auth"><h1>${esc(title)}</h1><p class="mut">${esc(text)}</p>
  ${again ? '<button class="btn" id="ag">Check again</button>' : ""}<button class="link" id="lo">Log out</button></main>`;
  $("#lo").onclick = logout;
  if (again) $("#ag").onclick = () => loadMe();
}
async function placeFlow(user) {
  const md = user.user_metadata || {}, sp = String(md.sponsor_code || "").toUpperCase();
  if (sp && sp === String(cfg.company_member_code || "").toUpperCase())
    return gate("Registration received", "The company will place you in the team and then activate your ID. Please check back soon.", true);
  if (sp && md.side) {
    const {error} = await sb.rpc("register_placement", {p_parent_code: sp, p_side: md.side, p_sponsor_code: sp});
    if (!error) return loadMe();
    toast(error.message, true);
  }
  placeView(sp, md.side);
}
async function logout() { await sb.auth.signOut(); me = null; page = "portal"; hist = []; welcomeView(); }

function placeView(sp0 = "", side0 = "L") {
  app.innerHTML = `<main class="auth"><h1>Join the team</h1>
  <p class="mut">Enter the member ID of the person who invited you, and choose where you sit under them.</p>
  <form id="f" class="card">
    ${idField("sp", "Sponsor ID", true, idRest(sp0))}
    ${idField("pa", 'Place under member ID <span class="note">(leave empty to sit directly under your sponsor)</span>', false)}
    <label>Side<select name="side"><option value="L"${side0 !== "R" ? " selected" : ""}>Left</option><option value="R"${side0 === "R" ? " selected" : ""}>Right</option></select></label>
    <button class="btn">Confirm my place</button>
  </form><button class="link" id="lo">Log out</button></main>`;
  $("#lo").onclick = logout;
  $("#f").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), sp = fullId(f.get("sp")), pa = fullId(f.get("pa")) || sp;
    act($(".btn"), async () => {
      await call(sb.rpc("register_placement", {p_parent_code: pa, p_side: f.get("side"), p_sponsor_code: sp}));
      await loadMe();
    });
  };
}
function activateView() {
  app.innerHTML = `<main class="auth"><h1>Activate your ID</h1>
  <p class="mut">Enter the secret pin you received from the company or your team leader.</p>
  <form id="f" class="card">${pwf("pin", "Activation pin", "off", 1)}
  <button class="btn">Activate</button></form><button class="link" id="lo">Log out</button></main>`;
  $("#lo").onclick = logout;
  $("#f").onsubmit = e => {
    e.preventDefault();
    act($(".btn"), async () => {
      await call(sb.rpc("activate_with_pin", {p_pin: new FormData(e.target).get("pin")}));
      toast("Your ID is active."); await loadMe();
    });
  };
}

/* ---------- main app ---------- */
let faPath = [], page = "portal", hist = [], isAdmin = false, authUser = null, soonT = "";
const NAV = [["portal", "Home"], ["shop", "Shop"], ["wallet", "Wallet"], ["profile", "Profile"]];
const MENU = [["grid", "Home", "portal"], ["shield", "Founder Administration", "fa", 1], ["grid", "Dashboard", "dash"], ["user", "My Profile", "profile"],
  ["share", "Genealogy", "tree"], ["userplus", "New Member Registration", "newreg"], ["package", "Products & Catalog", "shop"], ["cart", "My Purchases / Orders", "orders"],
  ["wallet", "Wallet & Withdrawals", "wallet"], ["bank", "Bank Details & KYC", "bank"], ["ticket", "My Coupons & Pins", "coupons"], ["users", "Team Members", "tree"],
  ["headset", "Help Line & Support", "soon"], ["bell", "Notifications", "notes"], ["key", "Change Password", "password"], ["logout", "Logout", "logout"]];
const PAGES = {portal: {t: "Member Portal", f: portal}, menu: {t: "Member Menu", f: menu}, dash: {t: "Dashboard", f: home}, profile: {t: "My Profile", f: profile},
  pdetails: {t: "My Profile Details", f: pdetails}, pedit: {t: "Edit Profile Details", f: pedit}, tree: {t: "Genealogy", f: team}, newreg: {t: "New Member Registration", f: newreg},
  shop: {t: "Products & Catalog", f: shop}, orders: {t: "My Purchases / Orders", f: orders}, wallet: {t: "Wallet & Withdrawals", f: wallet}, payouts: {t: "Payout Details", f: payouts},
  coupons: {t: "My Coupons & Pins", f: coupons}, notes: {t: "Notifications", f: notes}, password: {t: "Change Password", f: password}, soon: {t: "", f: soon},
  bank: {t: "Bank Details & KYC", f: bank}, kycdocs: {t: "KYC Documents", f: kycdocs}, fa: {t: "", f: fa}, cpd: {t: "Coupon & Pin Dashboard", f: cpd}, cpg: {t: "Generate Pin & Distribution", f: cpg},
  cph: {t: "Coupon & Pin History", f: cph}, wdm: {t: "Withdrawal Management", f: wdm}, kycr: {t: "KYC Review", f: kycr}, ords: {t: "Orders & Delivery", f: ords}, prodm: {t: "Products", f: prodm}, bvrun: {t: "Daily BV Calculation", f: bvrun}};

function go(p, push = true) { if (push && page !== p) hist.push(page); page = p; render(); window.scrollTo(0, 0); }
function faTitle() { let l = FA, t = "Founder Administration"; for (const i of faPath) { t = l[i][0]; l = l[i][1]; } return t; }
function render() {
  const P = PAGES[page], T = page === "fa" ? faTitle() : page === "soon" ? soonT : P.t;
  app.innerHTML = `<div class="tb">${page === "portal" ? '<b>Member Portal</b><button class="menu" id="mn">☰ Menu</button>' : `<button class="bk" id="bk" aria-label="Back">←</button><b>${esc(T)}</b>`}</div>
  <main id="v"><p class="mut">Loading…</p></main>
  <nav>${NAV.map(([k, l]) => `<button data-p="${k}" class="${k === page ? "on" : ""}">${l}</button>`).join("")}</nav>`;
  if ($("#mn")) $("#mn").onclick = () => go("menu");
  if ($("#bk")) $("#bk").onclick = () => { if (page === "fa" && faPath.length) { faPath.pop(); render(); } else go(hist.pop() || "portal", false); };
  app.querySelectorAll("nav button").forEach(b => b.onclick = () => { hist = b.dataset.p === "portal" ? [] : ["portal"]; go(b.dataset.p, false); });
  Promise.resolve().then(() => P.f()).catch(() => {});
}
async function portal() {
  $("#v").innerHTML = `<div class="pt"><img class="plogo" src="logo.png" alt="" onerror="this.remove()"><h1 class="nm"><span class="wl">Welcome</span><br>${esc(me.full_name || "Member")}</h1>${me.full_name ? "" : '<p class="note">Add your name in My Profile.</p>'}</div>`;
}

async function shop() {
  const [p, o] = await Promise.all([
    sb.from("products").select("*").eq("active", true).order("created_at"),
    sb.from("orders").select("*").order("created_at", {ascending: false}).limit(10)]);
  const items = p.data || [];
  $("#v").innerHTML = `<h2>Garments</h2>${items.map(x => `<div class="card"><div class="row" style="border:0;padding:0">
    <div><b>${esc(x.name)}</b><br><span class="note">${esc(x.description || "")}</span><br><b>${inr(x.price)}</b> <span class="note">${+x.pv} PV</span></div>
    <div class="qty"><button data-id="${x.id}" data-d="-1" aria-label="Less">−</button><span id="q-${x.id}">${cart[x.id] || 0}</span><button data-id="${x.id}" data-d="1" aria-label="More">+</button></div></div></div>`).join("") || '<p class="mut">No garments are listed yet. Please check back soon.</p>'}
  ${items.length ? `<div class="card"><div class="row" style="border:0"><span>Order total</span><b id="tot"></b></div><button class="btn" id="po">Place order</button>
  <p class="note" style="margin-top:8px">The company confirms your order after payment and updates its status here.</p></div>` : ""}
  <h2>My orders</h2><div class="card">${(o.data || []).map(x => `<div class="row"><span>${day(x.created_at)}</span><span class="tag">${STATUS[x.status] || x.status}</span><b>${inr(x.total)}</b></div>`).join("") || '<p class="mut">You have not placed an order yet.</p>'}</div>`;
  const total = () => { const t = $("#tot"); if (t) t.textContent = inr(items.reduce((s, x) => s + (cart[x.id] || 0) * x.price, 0)); };
  total();
  $("#v").querySelectorAll(".qty button").forEach(b => b.onclick = () => {
    const id = b.dataset.id; cart[id] = Math.max(0, Math.min(100, (cart[id] || 0) + +b.dataset.d));
    $("#q-" + id).textContent = cart[id]; total();
  });
  const po = $("#po");
  if (po) po.onclick = () => act(po, async () => {
    const list = Object.entries(cart).filter(([, q]) => q > 0).map(([product_id, qty]) => ({product_id, qty}));
    if (!list.length) { toast("Choose at least one garment.", true); return; }
    await call(sb.rpc("place_order", {p_items: list}));
    cart = {}; toast("Order placed."); await shop();
  });
}

function cropper(src, onSave) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet"><canvas id="cv" width="280" height="280"></canvas><input type="range" id="zm" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><button class="btn" id="sv">Save photo</button><button class="link" id="cn">Cancel</button></div>`;
  document.body.appendChild(m);
  const cv = $("#cv", m), x = cv.getContext("2d"), V = 280, img = new Image();
  let z = 1, ox = 0, oy = 0, drag = null;
  const dims = () => { const k = Math.max(V / img.width, V / img.height) * z; return [img.width * k, img.height * k]; };
  const draw = () => { const [w, h] = dims(); ox = Math.min(0, Math.max(V - w, ox)); oy = Math.min(0, Math.max(V - h, oy)); x.fillStyle = "#000"; x.fillRect(0, 0, V, V); x.drawImage(img, ox, oy, w, h); };
  img.onload = () => { const [w, h] = dims(); ox = (V - w) / 2; oy = (V - h) / 2; draw(); };
  img.onerror = () => { m.remove(); toast("Could not open this photo.", true); };
  img.src = src;
  cv.onpointerdown = e => { drag = [e.clientX - ox, e.clientY - oy]; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (drag) { ox = e.clientX - drag[0]; oy = e.clientY - drag[1]; draw(); } };
  cv.onpointerup = () => { drag = null; };
  $("#zm", m).oninput = e => {
    const [w0, h0] = dims(), cx = (V / 2 - ox) / w0, cy = (V / 2 - oy) / h0;
    z = +e.target.value; const [w, h] = dims(); ox = V / 2 - cx * w; oy = V / 2 - cy * h; draw();
  };
  $("#cn", m).onclick = () => m.remove();
  $("#sv", m).onclick = () => act($("#sv", m), async () => {
    const o = document.createElement("canvas"); o.width = o.height = 512;
    const f = 512 / V, [w, h] = dims();
    o.getContext("2d").drawImage(img, ox * f, oy * f, w * f, h * f);
    const blob = await new Promise(r => o.toBlob(r, "image/jpeg", 0.85));
    if (!blob) { toast("Could not save the photo.", true); return; }
    await onSave(blob); m.remove();
  });
}

  await call(sb.from("members").update({photo_path: path}).eq("id", me.id));
  me.photo_path = path; toast("Photo updated."); await profile();

  me.photo_path = null; toast("Photo removed."); await profile();
}

function shrink(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Could not read the photo.")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("Could not read the photo.")); img.src = u;
  });
}

const docBox = (label, key, has) => `<div class="card"><b>${label}</b><p class="note">${has ? "Uploaded. You can upload again to replace it." : "Not uploaded yet."}</p>
  <button class="btn ghost" data-k="${key}" data-m="c">Scan with camera</button><button class="btn ghost" data-k="${key}" data-m="f">Upload photo</button>
  <input type="file" accept="image/*" capture="environment" hidden id="c-${key}"><input type="file" accept="image/*" hidden id="f-${key}"></div>`;
function bindDocs(keys, again) {
  $("#v").querySelectorAll("[data-k]").forEach(b => b.onclick = () => $("#" + b.dataset.m + "-" + b.dataset.k).click());
  keys.forEach(k => ["c", "f"].forEach(p => $("#" + p + "-" + k).onchange = e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    act(e.target, async () => {
      const path = `${me.id}/${k}.jpg`;
      await call(sb.storage.from("kyc").upload(path, await shrink(f), {upsert: true, contentType: "image/jpeg"}));

}
